<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc">
  <title id="title">Panda's coding corner</title>
  <desc id="desc">A panda blinks behind a laptop while steam rises from a warm cup. Bamboo, coffee, and code.</desc>
  <style>
    text{font-family:'Segoe UI',Arial,sans-serif}.blink{transform-origin:240px 154px;animation:blink 5.5s infinite}.steam{animation:steam 3s ease-in-out infinite}.cursor{animation:cursor 1.4s steps(2,jump-none) infinite}.leaf{transform-origin:74px 272px;animation:sway 6s ease-in-out infinite}
    @keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}@keyframes steam{0%,100%{transform:translateY(0);opacity:.35}50%{transform:translateY(-9px);opacity:.8}}@keyframes cursor{to{opacity:0}}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media(prefers-reduced-motion:reduce){.blink,.steam,.cursor,.leaf{animation:none}}
  </style>
