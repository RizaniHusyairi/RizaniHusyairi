  <ellipse cx="271" cy="151" rx="21" ry="26" fill="#20312c" transform="rotate(-25 271 151)"/>
  <g class="blink" fill="#fffdf4"><ellipse cx="211" cy="154" rx="6" ry="8"/><ellipse cx="267" cy="154" rx="6" ry="8"/></g>
