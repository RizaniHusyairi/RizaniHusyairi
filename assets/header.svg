<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Rizani Husyairi - Full-Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1021"/>
      <stop offset="55%" stop-color="#111634"/>
      <stop offset="100%" stop-color="#0d1b2e"/>
    </linearGradient>

    <radialGradient id="blobA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#38bdf8"/>
      <stop offset="35%"  stop-color="#a78bfa"/>
      <stop offset="70%"  stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
      <animate attributeName="x1" values="-1;0;-1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1;0"  dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#7dd3fc" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="frame"><rect width="1000" height="280" rx="22"/></clipPath>

    <style>
      .t { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', system-ui, sans-serif; }
      .fade { opacity: 0; animation: fadeUp .9s ease-out forwards; }
      @keyframes fadeUp { from { opacity:0; transform: translateY(14px);} to { opacity:1; transform:none; } }
      .d1 { animation-delay:.15s } .d2 { animation-delay:.45s } .d3 { animation-delay:.75s } .d4 { animation-delay:1.05s }
      .drift  { animation: drift 14s ease-in-out infinite alternate; }
      .drift2 { animation: drift2 17s ease-in-out infinite alternate; }
      .drift3 { animation: drift3 11s ease-in-out infinite alternate; }
      @keyframes drift  { from { transform: translate(0,0) scale(1);} to { transform: translate(90px,26px) scale(1.18);} }
      @keyframes drift2 { from { transform: translate(0,0) scale(1.1);} to { transform: translate(-80px,-22px) scale(.92);} }
      @keyframes drift3 { from { transform: translate(0,0);} to { transform: translate(50px,-34px);} }
      .twinkle { animation: tw 3s ease-in-out infinite; }
      @keyframes tw { 0%,100%{opacity:.15} 50%{opacity:.9} }
      .pulse { animation: pl 2.4s ease-in-out infinite; transform-origin:center; }
      @keyframes pl { 0%,100%{ opacity:.35; r:5 } 50%{ opacity:1; r:6.5 } }
      .scan { animation: scan 5s linear infinite; }
      @keyframes scan { 0%{ transform: translateX(-420px);} 100%{ transform: translateX(1060px);} }
      .spin { animation: spin 26s linear infinite; transform-origin: 838px 140px; }
      .spinr{ animation: spin 18s linear infinite reverse; transform-origin: 838px 140px; }
      @keyframes spin { to { transform: rotate(360deg);} }
      @media (prefers-reduced-motion: reduce) {
        .drift,.drift2,.drift3,.twinkle,.pulse,.scan,.spin,.spinr,.fade { animation: none; }
        .fade { opacity: 1; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <rect width="1000" height="280" fill="url(#grid)"/>

    <g filter="url(#soft)">
      <circle class="drift"  cx="180" cy="90"  r="150" fill="url(#blobA)"/>
      <circle class="drift2" cx="820" cy="200" r="170" fill="url(#blobB)"/>
      <circle class="drift3" cx="520" cy="40"  r="130" fill="url(#blobC)"/>
    </g>

    <!-- twinkling stars -->
    <g fill="#e0f2fe">
      <circle class="twinkle" cx="120" cy="220" r="1.6" style="animation-delay:0s"/>
      <circle class="twinkle" cx="300" cy="46"  r="1.3" style="animation-delay:.5s"/>
      <circle class="twinkle" cx="470" cy="230" r="1.8" style="animation-delay:1s"/>
      <circle class="twinkle" cx="640" cy="60"  r="1.4" style="animation-delay:1.5s"/>
      <circle class="twinkle" cx="905" cy="70"  r="1.6" style="animation-delay:2s"/>
      <circle class="twinkle" cx="960" cy="245" r="1.3" style="animation-delay:2.5s"/>
      <circle class="twinkle" cx="60"  cy="130" r="1.5" style="animation-delay:1.2s"/>
    </g>

    <!-- orbit rings -->
    <g opacity="0.5">
      <g class="spin">
        <ellipse cx="838" cy="140" rx="96" ry="96" fill="none" stroke="#38bdf8" stroke-opacity=".35" stroke-width="1.2" stroke-dasharray="6 10"/>
        <circle cx="934" cy="140" r="4.5" fill="#38bdf8" filter="url(#glow)"/>
      </g>
      <g class="spinr">
        <ellipse cx="838" cy="140" rx="66" ry="66" fill="none" stroke="#f472b6" stroke-opacity=".35" stroke-width="1.2" stroke-dasharray="4 8"/>
        <circle cx="772" cy="140" r="3.5" fill="#f472b6" filter="url(#glow)"/>
      </g>
      <circle cx="838" cy="140" r="30" fill="none" stroke="#a78bfa" stroke-opacity=".5" stroke-width="1.2"/>
      <text class="t" x="838" y="148" text-anchor="middle" font-size="24" fill="#c4b5fd" font-weight="700">&lt;/&gt;</text>
    </g>

    <!-- text block -->
    <g class="t">
      <g class="fade d1">
        <rect x="72" y="52" width="188" height="28" rx="14" fill="#0ea5e9" fill-opacity=".12" stroke="#38bdf8" stroke-opacity=".45"/>
        <circle class="pulse" cx="92" cy="66" r="5" fill="#34d399"/>
        <text x="106" y="71" font-size="13" fill="#7dd3fc" letter-spacing="1.4">AVAILABLE FOR WORK</text>
      </g>

      <text class="fade d2" x="70" y="140" font-size="52" font-weight="800" fill="url(#nameGrad)" filter="url(#glow)">Rizani Husyairi</text>

      <text class="fade d3" x="72" y="176" font-size="19" fill="#94a3b8" letter-spacing=".6">
        Full-Stack Developer <tspan fill="#475569">•</tspan> AI Enthusiast <tspan fill="#475569">•</tspan> Indonesia
      </text>

      <g class="fade d4">
        <rect x="72" y="200" width="440" height="3" rx="2" fill="url(#lineGrad)"/>
        <text x="72" y="234" font-size="14" fill="#64748b" font-family="ui-monospace, 'Fira Code', Consolas, monospace">
          $ npm run build --  turning coffee into code
        </text>
      </g>
    </g>

    <!-- sweeping light -->
    <g class="scan" opacity=".16">
      <rect x="0" y="0" width="130" height="280" fill="#e0f2fe" transform="skewX(-18)"/>
    </g>

    <rect width="1000" height="280" rx="22" fill="none" stroke="#38bdf8" stroke-opacity=".25" stroke-width="1.5"/>
  </g>
</svg>
