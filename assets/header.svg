<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Rizani Husyairi — Panda Bamboo Studio</title>
  <desc id="desc">A waving panda in a bamboo garden beside Rizani's name and Full-Stack Developer introduction.</desc>
  <defs>
    <linearGradient id="forest" x2="1" y2="1"><stop stop-color="#163e35"/><stop offset="1" stop-color="#082b26"/></linearGradient>
    <pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#32564a" opacity=".1"/></pattern>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="438" rx="28"/></clipPath>
    <g id="bamboo">
      <path d="M0 420V25" stroke="#5c8a69" stroke-width="13" stroke-linecap="round"/>
      <path d="M-7 95H7M-7 180H7M-7 265H7M-7 350H7" stroke="#a4c788" stroke-width="3"/>
      <path d="M0 116Q-57 112-63 60Q-14 66 0 116M0 175Q53 160 62 117Q18 123 0 175M0 281Q-47 264-58 220Q-15 221 0 281M0 332Q47 316 54 275Q12 286 0 332" fill="#64936d"/>
    </g>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif}
      .wave{transform-origin:1008px 245px;animation:wave 4.8s ease-in-out infinite}
      .eyes{transform-origin:928px 202px;animation:blink 6s infinite}
      .sprig{transform-origin:1100px 410px;animation:sway 7s ease-in-out infinite}
      .leaf{animation:float 7s ease-in-out infinite}
      .spark{animation:glimmer 4s ease-in-out infinite}
      @keyframes wave{0%,45%,100%{transform:rotate(0)}55%,75%{transform:rotate(-17deg)}65%,85%{transform:rotate(9deg)}}
      @keyframes blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.08)}}
      @keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
      @keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(13px) rotate(3deg)}}
      @keyframes glimmer{0%,100%{opacity:.35}50%{opacity:1}}
      @media(prefers-reduced-motion:reduce){.wave,.eyes,.sprig,.leaf,.spark{animation:none}}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="440" fill="#f5f3e7"/>
    <rect width="750" height="440" fill="url(#grain)"/>
    <path d="M768 0H1200V440H722Q784 363 730 276T768 0" fill="url(#forest)"/>
    <circle cx="960" cy="148" r="107" fill="#b9cea0" opacity=".13"/>
    <circle cx="960" cy="148" r="82" fill="#dce7ba" opacity=".12"/>
    <g opacity=".28"><use href="#bamboo" x="784" y="-10"/><use href="#bamboo" x="1170" y="-48"/></g>
    <g class="sprig"><use href="#bamboo" x="1100" y="18"/></g>
    <path d="M730 398Q876 318 1200 386V440H722Z" fill="#285043"/>
    <path d="M719 426Q976 357 1200 413V440H714Z" fill="#365e49"/>
    <g class="spark" fill="#dce7ba"><circle cx="831" cy="104" r="3"/><circle cx="1052" cy="78" r="2"/><circle cx="1073" cy="308" r="3"/><path d="M825 272v12m-6-6h12" stroke="#dce7ba" stroke-width="2"/></g>
    <g class="leaf" fill="#86a976"><path d="M685 61Q655 33 637 48Q650 74 685 61"/><path d="M1073 144Q1080 111 1102 116Q1105 140 1073 144"/></g>
    <!-- Text is visible even if animations are disabled. -->
    <rect x="64" y="57" width="236" height="32" rx="16" fill="#e3e9d7"/>
    <circle cx="83" cy="73" r="4" fill="#3b7758"/>
    <text x="98" y="78" fill="#355c45" font-size="12" font-weight="700" letter-spacing="2">PANDA BAMBOO STUDIO</text>
    <text x="64" y="144" font-size="23" fill="#5c7161">Halo, saya</text>
    <text x="60" y="216" font-size="68" font-weight="800" letter-spacing="-3" fill="#163e35">Rizani Husyairi<tspan fill="#729057">.</tspan></text>
    <text x="64" y="258" font-size="22" fill="#355b48">Full-Stack Developer &amp; AI Enthusiast</text>
    <path d="M64 287H125" stroke="#789663" stroke-width="3" stroke-linecap="round"/>
    <text x="64" y="326" font-size="18" fill="#627363">Ide besar. Langkah kecil. Kode sepenuh hati.</text>
    <text x="64" y="387" font-size="12" fill="#4c6e56" letter-spacing="2.5">BASED IN INDONESIA · OPEN TO COLLABORATE</text>
    <!-- Separate arm and eyes keep the mascot's motion gentle. -->
    <ellipse cx="937" cy="380" rx="103" ry="17" fill="#092d27" opacity=".4"/>
    <ellipse cx="935" cy="297" rx="77" ry="80" fill="#172c2a"/>
    <ellipse cx="935" cy="301" rx="56" ry="65" fill="#f6f4e9"/>
    <ellipse cx="877" cy="359" rx="35" ry="25" fill="#172c2a" transform="rotate(-15 877 359)"/>
    <ellipse cx="990" cy="359" rx="35" ry="25" fill="#172c2a" transform="rotate(15 990 359)"/>
    <ellipse cx="867" cy="276" rx="25" ry="43" fill="#172c2a" transform="rotate(-20 867 276)"/>
    <g class="wave">
      <path d="M990 270Q1020 271 1042 220" fill="none" stroke="#172c2a" stroke-width="40" stroke-linecap="round"/>
      <ellipse cx="1045" cy="206" rx="26" ry="30" fill="#172c2a"/>
      <ellipse cx="1046" cy="211" rx="12" ry="10" fill="#c9b7a8"/>
      <g fill="#c9b7a8"><circle cx="1033" cy="195" r="4"/><circle cx="1045" cy="189" r="4"/><circle cx="1057" cy="196" r="4"/></g>
    </g>
    <circle cx="876" cy="144" r="30" fill="#172c2a"/><circle cx="987" cy="144" r="30" fill="#172c2a"/>
    <circle cx="876" cy="144" r="15" fill="#42504a"/><circle cx="987" cy="144" r="15" fill="#42504a"/>
    <ellipse cx="932" cy="200" rx="83" ry="72" fill="#fcfaf0"/>
    <ellipse cx="896" cy="198" rx="23" ry="29" fill="#172c2a" transform="rotate(28 896 198)"/>
    <ellipse cx="965" cy="198" rx="23" ry="29" fill="#172c2a" transform="rotate(-28 965 198)"/>
    <g class="eyes" fill="#fcfaf0"><ellipse cx="901" cy="202" rx="7" ry="9"/><ellipse cx="960" cy="202" rx="7" ry="9"/></g>
    <g fill="#dca997" opacity=".6"><ellipse cx="879" cy="224" rx="14" ry="7"/><ellipse cx="982" cy="224" rx="14" ry="7"/></g>
    <path d="M922 222Q932 216 942 222Q940 231 932 232Q924 231 922 222" fill="#172c2a"/>
    <path d="M932 231v7m-13-1q13 15 26 0" fill="none" stroke="#172c2a" stroke-width="3" stroke-linecap="round"/>
    <path d="M912 272l20 10-20 10m40-20-20 10 20 10" fill="#739865"/><circle cx="932" cy="282" r="5" fill="#456e4e"/>
    <rect x=".75" y=".75" width="1198.5" height="438.5" rx="28" fill="none" stroke="#becdb4" stroke-width="1.5"/>
  </g>
</svg>
