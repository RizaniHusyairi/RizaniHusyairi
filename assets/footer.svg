<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc">
  <title id="title">Thanks for visiting my bamboo corner</title>
  <desc id="desc">A little panda peeks over a green garden, inviting you to build something together.</desc>
  <defs><clipPath id="frame"><rect width="1200" height="190" rx="24"/></clipPath></defs>
  <style>text{font-family:'Segoe UI',Arial,sans-serif}.peek{animation:peek 7s ease-in-out infinite}.leaf{animation:drift 6s ease-in-out infinite}@keyframes peek{0%,100%{transform:translateY(6px)}50%{transform:translateY(-5px)}}@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}@media(prefers-reduced-motion:reduce){.peek,.leaf{animation:none}}</style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="190" fill="#123c32"/><circle cx="1050" cy="20" r="180" fill="#244e3e"/>
    <path d="M0 167Q280 120 600 164T1200 148V190H0Z" fill="#315b44"/>
    <text x="64" y="67" font-size="12" letter-spacing="3" fill="#b7ce9e">SMALL STEPS. MEANINGFUL BUILDS.</text>
    <text x="62" y="109" font-size="30" font-weight="700" fill="#f5f3e7">Mari tumbuhkan ide berikutnya bersama.</text>
    <text x="64" y="142" font-size="16" fill="#c0d1b9">Terima kasih sudah mampir ke sudut bambu saya.</text>
    <g class="peek">
      <circle cx="918" cy="91" r="23" fill="#142923"/><circle cx="1007" cy="91" r="23" fill="#142923"/>
      <ellipse cx="963" cy="135" rx="66" ry="57" fill="#f5f3e7"/>
      <ellipse cx="935" cy="128" rx="17" ry="21" fill="#142923" transform="rotate(25 935 128)"/>
      <ellipse cx="990" cy="128" rx="17" ry="21" fill="#142923" transform="rotate(-25 990 128)"/>
      <path d="M929 131q6-8 12 0m43 0q6-8 12 0" fill="none" stroke="#f5f3e7" stroke-width="3" stroke-linecap="round"/>
      <path d="M957 146q6-5 12 0l-6 6Z" fill="#142923"/>
    </g>
    <path d="M850 180Q982 157 1110 179V190H850Z" fill="#739363"/>
    <ellipse cx="921" cy="175" rx="19" ry="12" fill="#142923"/><ellipse cx="1004" cy="175" rx="19" ry="12" fill="#142923"/>
    <path class="leaf" d="M1097 85Q1059 78 1070 53Q1099 52 1097 85M1101 91Q1103 62 1131 70Q1132 89 1101 91" fill="#92b079"/>
  </g>
</svg>
