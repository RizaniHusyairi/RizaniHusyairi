name: Update Panda Profile Stats

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate-stats.mjs
      - scripts/generate-stats.test.mjs
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

concurrency:
  group: panda-profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test generator
        run: node --test scripts/generate-stats.test.mjs
      - name: Generate images from GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: node scripts/generate-stats.mjs
      - name: Commit updated images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/generated/stats.svg assets/generated/languages.svg assets/generated/activity.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh panda profile statistics'
          git pull --rebase origin main
          git push origin HEAD:main
